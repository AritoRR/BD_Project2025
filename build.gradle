plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.5' // или актуальная версия
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'ru.ananev'
version = '1.0.0'
sourceCompatibility = '11' // или '17'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starter Data JPA (включает Hibernate + JPA)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // PostgreSQL драйвер
    implementation 'org.postgresql:postgresql'

    // Spring Boot Starter Web (для MVC)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Boot Starter Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Spring Boot Starter Thymeleaf (если нужен веб-интерфейс)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Для валидации данных
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Миграции БД (Flyway)
    implementation 'org.flywaydb:flyway-core'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity5'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity5'
    implementation 'org.postgresql:postgresql'

    // Тестирование
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

test {
    useJUnitPlatform()
}