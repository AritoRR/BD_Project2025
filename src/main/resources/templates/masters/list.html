<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Мастера</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Список мастеров</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="alert alert-info">
        Текущее количество мастеров: <span th:text="${mastersCount}"></span> / <span th:text="${maxMasters}"></span>
    </div>

    <a href="/masters/create" class="btn btn-primary mb-3">Добавить мастера</a>
    <a href="/" class="btn btn-secondary mb-3">На главную</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="master : ${masters}">
            <td th:text="${master.id}"></td>
            <td th:text="${master.name}"></td>
            <td>
                <a th:href="@{/masters/edit/{id}(id=${master.id})}" class="btn btn-sm btn-warning">Редактировать</a>
                <form th:action="@{/masters/delete/{id}(id=${master.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Удалить мастера?')">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
