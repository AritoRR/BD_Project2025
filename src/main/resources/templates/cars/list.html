<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Автомобили</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Список автомобилей</h2>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <a href="/cars/create" class="btn btn-primary mb-3">Добавить автомобиль</a>
    <a href="/" class="btn btn-secondary mb-3">На главную</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Номер</th>
            <th>Марка</th>
            <th>Цвет</th>
            <th>Тип</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="car : ${cars}">
            <td th:text="${car.id}"></td>
            <td th:text="${car.number}"></td>
            <td th:text="${car.mark}"></td>
            <td th:text="${car.color}"></td>
            <td>
                <span th:if="${car.isForeign}" class="badge bg-warning">Иномарка</span>
                <span th:unless="${car.isForeign}" class="badge bg-info">Отечественный</span>
            </td>
            <td>
                <a th:href="@{/cars/edit/{id}(id=${car.id})}" class="btn btn-sm btn-warning">Редактировать</a>
                <form th:action="@{/cars/delete/{id}(id=${car.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Удалить автомобиль?')">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
