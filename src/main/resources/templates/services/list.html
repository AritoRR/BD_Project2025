<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Услуги</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h2>Список услуг</h2>

  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

  <a href="/services/create" class="btn btn-primary mb-3">Добавить услугу</a>
  <a href="/" class="btn btn-secondary mb-3">На главную</a>

  <!-- Форма для увеличения цен -->
  <div class="card mb-4">
    <div class="card-header">
      <h5>Управление ценами</h5>
    </div>
    <div class="card-body">
      <form th:action="@{/services/increase-prices}" method="post" class="row g-3">
        <div class="col-auto">
          <label class="form-label">Увеличить все цены на (%)</label>
          <input type="number" class="form-control" name="percentage" step="0.1" min="0.1" required>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-warning mt-4">Применить</button>
        </div>
      </form>
    </div>
  </div>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>Название</th>
      <th>Стоимость (отечеств.)</th>
      <th>Стоимость (иномарка)</th>
      <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="service : ${services}">
      <td th:text="${service.id}"></td>
      <td th:text="${service.name}"></td>
      <td th:text="${#numbers.formatDecimal(service.costOur, 1, 2)}"> руб.</td>
      <td th:text="${#numbers.formatDecimal(service.costForeign, 1, 2)}"> руб.</td>
      <td>
        <a th:href="@{/services/edit/{id}(id=${service.id})}" class="btn btn-sm btn-warning">Редактировать</a>
        <form th:action="@{/services/delete/{id}(id=${service.id})}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-sm btn-danger"
                  onclick="return confirm('Удалить услугу?')">Удалить</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
