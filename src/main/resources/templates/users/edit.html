<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Редактировать пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Редактировать пользователя</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/users/edit/{id}(id=${user.id})}" th:object="${user}" method="post">
        <div class="mb-3">
            <label class="form-label">Логин</label>
            <input type="text" class="form-control" th:field="*{username}" required>
            <div th:if="${#fields.hasErrors('username')}" class="text-danger" th:errors="*{username}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" class="form-control" th:field="*{password}"
                   placeholder="Оставьте пустым, если не нужно менять пароль">
            <div th:if="${#fields.hasErrors('password')}" class="text-danger" th:errors="*{password}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Роль</label>
            <select class="form-control" th:field="*{role}" required>
                <option value="">Выберите роль</option>
                <option value="ADMIN">Администратор</option>
                <option value="OPERATOR">Оператор</option>
            </select>
            <div th:if="${#fields.hasErrors('role')}" class="text-danger" th:errors="*{role}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="/users" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
