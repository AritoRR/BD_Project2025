<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Вход в систему</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      border: 1px solid #dee2e6;
      border-radius: 10px;
      background: white;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
<div class="container">
  <div class="login-container">
    <div class="text-center mb-4">
      <h2>🚗 Автосервис</h2>
      <p class="text-muted">Вход в систему</p>
    </div>

    <!-- Сообщения об ошибках -->
    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show">
      <strong>Ошибка!</strong> Неверный логин или пароль.
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show">
      <strong>Успех!</strong> Вы вышли из системы.
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label class="form-label">Логин</label>
        <input type="text" class="form-control" name="username" required
               placeholder="Введите логин" autofocus>
      </div>

      <div class="mb-3">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-control" name="password" required
               placeholder="Введите пароль">services
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2">Войти</button>
    </form>

    <hr class="my-4">

    <div class="text-center">
      <h6>Тестовые доступы:</h6>
      <div class="card mt-3">
        <div class="card-body">
          <p class="mb-1"><strong>Пароль для всех:</strong> <code>1111</code></p>
          <hr class="my-2">
          <p class="mb-1"><strong>admin</strong> - Администратор (полный доступ)</p>
          <p class="mb-0"><strong>operator</strong> - Оператор (только работы и отчеты)</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
