<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Редактировать автомобиль</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h2>Редактировать автомобиль</h2>

  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

  <form th:action="@{/cars/edit/{id}(id=${car.id})}" th:object="${car}" method="post">
    <div class="mb-3">
      <label class="form-label">Номер автомобиля</label>
      <input type="text" class="form-control" th:field="*{number}" required>
      <div th:if="${#fields.hasErrors('number')}" class="text-danger" th:errors="*{number}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Марка</label>
      <input type="text" class="form-control" th:field="*{mark}" required>
      <div th:if="${#fields.hasErrors('mark')}" class="text-danger" th:errors="*{mark}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Цвет</label>
      <input type="text" class="form-control" th:field="*{color}" required>
      <div th:if="${#fields.hasErrors('color')}" class="text-danger" th:errors="*{color}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Тип автомобиля</label>
      <select class="form-control" th:field="*{isForeign}" required>
        <option value="false">Отечественный</option>
        <option value="true">Иномарка</option>
      </select>
      <div th:if="${#fields.hasErrors('isForeign')}" class="text-danger" th:errors="*{isForeign}"></div>
    </div>

    <button type="submit" class="btn btn-primary">Обновить</button>
    <a href="/cars" class="btn btn-secondary">Отмена</a>
  </form>
</div>
</body>
</html>
