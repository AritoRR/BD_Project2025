<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
  <title>Назначенные работы</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="/dashboard">🚗 Автосервис</a>
    <div class="navbar-nav ms-auto">
            <span class="navbar-text text-white me-3">
                <span sec:authentication="name"></span>
            </span>
      <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">Главная</a>
      <form th:action="@{/logout}" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
      </form>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>📋 Назначенные работы</h2>
    <a href="/works/create" class="btn btn-success">➕ Назначить работу</a>
  </div>

  <!-- Сообщения -->
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${errorMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="card">
    <div class="card-body">
      <div th:if="${#lists.isEmpty(works)}" class="text-center py-4">
        <h5 class="text-muted">Нет назначенных работ</h5>
        <p class="text-muted">Назначьте первую работу</p>
        <a href="/works/create" class="btn btn-primary">Назначить работу</a>
      </div>

      <div th:unless="${#lists.isEmpty(works)}">
        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
              <th>Дата</th>
              <th>Мастер</th>
              <th>Автомобиль</th>
              <th>Услуга</th>
              <th>Стоимость</th>
              <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="work : ${works}">
              <td th:text="${#temporals.format(work.dateWork, 'dd.MM.yyyy')}"></td>
              <td th:text="${work.masterName}"></td>
              <td>
                <span th:text="${work.carMark}"></span>
                <br>
                <small class="text-muted" th:text="${work.carNumber}"></small>
              </td>
              <td th:text="${work.serviceName}"></td>
              <td>
                <span th:text="${#numbers.formatDecimal(work.actualCost, 1, 2)}"></span> руб.
              </td>
              <td>
                <a th:href="@{/works/edit/{id}(id=${work.id})}"
                   class="btn btn-sm btn-warning">✏️</a>
                <form th:action="@{/works/delete/{id}(id=${work.id})}"
                      method="post"
                      style="display:inline;"
                      onsubmit="return confirm('Удалить эту работу?')">
                  <button type="submit" class="btn btn-sm btn-danger">🗑️</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-3">
    <a href="/dashboard" class="btn btn-secondary">← Назад в панель управления</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
