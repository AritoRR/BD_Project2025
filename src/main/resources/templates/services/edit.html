<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Редактировать услугу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Редактировать услугу</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/services/edit/{id}(id=${service.id})}" th:object="${service}" method="post">
        <div class="mb-3">
            <label class="form-label">Наименование услуги</label>
            <input type="text" class="form-control" th:field="*{name}" required>
            <div th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Стоимость для отечественных автомобилей</label>
            <input type="number" step="0.01" class="form-control" th:field="*{costOur}" required>
            <div th:if="${#fields.hasErrors('costOur')}" class="text-danger" th:errors="*{costOur}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Стоимость для иномарок</label>
            <input type="number" step="0.01" class="form-control" th:field="*{costForeign}" required>
            <div th:if="${#fields.hasErrors('costForeign')}" class="text-danger" th:errors="*{costForeign}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="/services" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
